{% extends "base.html" %}
{% block title %}دخول الإدارة — StudyAI{% endblock %}
{% block content %}
<section class="auth-shell">
  <form class="auth-card" method="post">
    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
    <span class="eyebrow">منطقة خاصة</span><h1>دخول إدارة الموقع</h1>
    <label>اسم مدير الموقع<input name="username" autocomplete="username" required maxlength="80" value="{{ request.form.username }}"></label>
    <label>كلمة المرور<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label>
    <button class="button" type="submit">دخول إلى لوحة الإدارة</button>
    <p>لا يحتاج الطلاب إلى حساب. <a href="{{ url_for('auth.dashboard') }}">العودة إلى أداة التفريغ</a></p>
  </form>
</section>
{% endblock %}
