{% extends "base.html" %}
{% block title %}كلمة مرور جديدة — StudyAI{% endblock %}
{% block content %}
<section class="auth-shell"><form class="auth-card" method="post">
  <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
  <span class="eyebrow">تأمين الحساب</span><h1>اختر كلمة مرور جديدة</h1>
  <label>كلمة المرور الجديدة<input name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128"><small>ثمانية أحرف على الأقل.</small></label>
  <label>تأكيد كلمة المرور<input name="password_confirmation" type="password" autocomplete="new-password" required minlength="8" maxlength="128"></label>
  <button class="button" type="submit">حفظ كلمة المرور</button>
</form></section>
{% endblock %}
